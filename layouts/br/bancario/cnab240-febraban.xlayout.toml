# FEBRABAN CNAB 240: o padrão geral de intercâmbio entre bancos e empresas.
#
# Transcrito do manual "Layout Padrão FEBRABAN 240 posições", versão 11.0, de
# 11/09/2026, publicado em https://portal.febraban.org.br/ (página "Layouts").
# As posições, os tamanhos, os formatos e os códigos de nota (G001, P007...) de
# cada campo vêm das tabelas do manual; a nota de cada campo está na descrição.
#
# Cobre o header e o trailer de arquivo, o pagamento por crédito em conta,
# cheque, OP, TED e Pix (segmentos A, B, C e Z), o pagamento de títulos de
# cobrança (J e J-52) e os títulos em cobrança (P, Q, R na remessa; T e U no
# retorno). Os demais serviços do manual (tributos, débito em conta, extrato,
# custódia, vendor, compror...) e os segmentos opcionais X e Y ainda não estão
# aqui: suas linhas aparecem na aba "! No record type". O README desta pasta
# diz como contribuir com eles.
#
# Cada banco publica as suas particularidades (campos de uso do banco, códigos de
# ocorrência). Este é o padrão FEBRABAN, sem elas.

schema = 1
id = "br/bancario/cnab240-febraban"
name = "FEBRABAN CNAB 240 — Padrão Geral"
description = "Remessa e retorno de pagamentos e de cobrança, 240 posições"
country = "BR"
category = "banking"
status = "verified"
spec_source = "FEBRABAN — Layout Padrão FEBRABAN 240 posições"
spec_version = "11.0 (11/09/2026)"
spec_url = "https://portal.febraban.org.br/pagina/3425/33/pt-br/layout-febraban"

format = "positional"
encoding = "auto"
offset_unit = "chars"
line_length = 240
strict_positions = true
hide_filler = true

[detect]
line_length = 240
first_line = [
  { pos = [4, 7], value = "0000" },
  { pos = [8, 8], value = "0" },
  { pos = [143, 143], in = ["1", "2"] },
  { pos = [164, 166], regex = "^[0-9]{3}$" },
]

