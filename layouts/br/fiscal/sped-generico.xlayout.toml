# SPED, qualquer arquivo de leiaute `|REG|campo|campo|`: EFD ICMS/IPI,
# EFD-Contribuições, ECD, ECF e outros.
#
# Declara só o que é comum a eles: a abertura (x001) e o encerramento (x990) de
# cada bloco e o bloco 9 de controle (9900, 9990 e 9999), com as conferências de
# totais. Cada outro registro vira uma aba própria, com os campos numerados
# (CAMPO_02, CAMPO_03...). Os campos e as regras de contagem foram conferidos no
# Guia Prático da EFD ICMS/IPI, versão 3.2.2 (atualização de 11/02/2026),
# Capítulo III, registros 0001, 0990, 9001, 9900, 9990 e 9999.

schema = 1
id = "br/fiscal/sped-generico"
name = "SPED — genérico (blocos e controle)"
description = "Qualquer arquivo SPED delimitado por |: abas por registro e conferência do bloco 9"
country = "BR"
category = "tax"
status = "verified"
spec_source = "Receita Federal — Guia Prático da EFD ICMS/IPI"
spec_version = "3.2.2 (11/02/2026)"
spec_url = "http://sped.rfb.gov.br/pasta/show/1573"

format = "delimited"
encoding = "auto"
delimiter = "|"
outer_delimiters = true
decimal_sep = ","
date_format = "DDMMYYYY"
allow_undeclared_records = true
# Arquivos assinados (ECD, ECF) trazem a assinatura digital depois do 9999.
stop_after_trailer = true

[detect]
# O 0000 abre todo arquivo SPED; o campo seguinte é a versão do leiaute (ou LECD, LECF...).
first_line = [{ col = 1, value = "0000" }, { col = 2, regex = "^[0-9A-Z]{1,8}$" }]

[discriminator]
col = 1

[[records]]
id = "x001"
ids = [
  "0001", "1001", "2001", "3001", "4001", "5001", "6001", "7001", "8001", "9001",
  "A001", "B001", "C001", "D001", "E001", "F001", "G001", "H001", "I001", "J001",
  "K001", "L001", "M001", "N001", "O001", "P001", "Q001", "R001", "S001", "T001",
  "U001", "V001", "W001", "X001", "Y001", "Z001",
]
name = "Abertura do bloco"
role = "batch_header"
desc = "Registros 0001, C001, 9001...: abrem cada bloco"
fields = [
  { name = "REG", col = 1, type = "code", desc = "Código do registro" },
  { name = "IND_MOV", col = 2, type = "code", desc = "Indicador de movimento", values = { "0" = "Bloco com dados informados", "1" = "Bloco sem dados informados" } },
]

[[records]]
id = "x990"
ids = [
  "0990", "1990", "2990", "3990", "4990", "5990", "6990", "7990", "8990", "9990",
  "A990", "B990", "C990", "D990", "E990", "F990", "G990", "H990", "I990", "J990",
  "K990", "L990", "M990", "N990", "O990", "P990", "Q990", "R990", "S990", "T990",
  "U990", "V990", "W990", "X990", "Y990", "Z990",
]
name = "Encerramento do bloco"
role = "batch_trailer"
desc = "Registros 0990, C990, 9990...: encerram cada bloco com a sua quantidade de linhas"
fields = [
  { name = "REG", col = 1, type = "code", desc = "Código do registro" },
  { name = "QTD_LIN_X", col = 2, type = "int", check = "block_lines", desc = "QTD_LIN_0, QTD_LIN_C...: quantidade total de linhas do bloco, contando a abertura e o encerramento. O bloco 0 conta também o 0000, e o bloco 9 conta o 9999" },
]

[[records]]
id = "9900"
name = "Registros do arquivo"
desc = "Uma linha por tipo de registro presente no arquivo, com a sua quantidade"
fields = [
  { name = "REG", col = 1, type = "code", desc = "Texto fixo contendo \"9900\"" },
  { name = "REG_BLC", col = 2, type = "code", desc = "Registro que será totalizado no próximo campo" },
  { name = "QTD_REG_BLC", col = 3, type = "int", check = "count_by_record:REG_BLC", desc = "Total de registros do tipo informado no campo anterior" },
]

[[records]]
id = "9999"
name = "Encerramento do arquivo digital"
role = "trailer"
fields = [
  { name = "REG", col = 1, type = "code", desc = "Texto fixo contendo \"9999\"" },
  { name = "QTD_LIN", col = 2, type = "int", check = "total_lines", desc = "Quantidade total de linhas do arquivo digital, contando o próprio 9999" },
]
