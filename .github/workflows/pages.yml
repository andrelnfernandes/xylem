name: Website

# Publishes the website (site/, with the images from docs/, and the manual
# from docs/manual/ as mdBook) on GitHub Pages whenever it changes on main.
# Needs Settings → Pages → Source: GitHub Actions. Publishing a release runs
# it too, for latest.txt: release.yml starts it, or release-site.yml when the
# release is published by hand.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/manual/**"
      - "docs/social-preview.png"
      - "docs/icons/**"
      - "docs/screenshots/*.png"
      - "docs/screenshots/*.gif"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # A fixed version, with the dependencies of its Cargo.lock (--locked),
      # each checked by crates.io's checksum; no plugins.
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.4 --locked
      - name: Assemble the site
        run: sh site/build.sh _site
      # The version Xylem's update check reads (docs/plans/update-check.md):
      # that of the latest published release, not of Cargo.toml, which
      # changes before the release is out. Three numbers or nothing.
      - name: The latest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          version=${tag#v}
          if ! [[ "$version" =~ ^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$ ]]; then
            echo "::error::the latest release is $tag, not vN.N.N"
            exit 1
          fi
          printf '%s\n' "$version" > _site/latest.txt
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
