name: Website

# Publishes the website (site/, with the images from docs/, and the manual
# from docs/manual/ as mdBook) on GitHub Pages whenever it changes on main.
# Needs Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/manual/**"
      - "docs/social-preview.png"
      - "docs/icons/**"
      - "docs/screenshots/*.png"
      - "docs/screenshots/*.gif"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # A fixed version, with the dependencies of its Cargo.lock (--locked),
      # each checked by crates.io's checksum; no plugins.
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.4 --locked
      - name: Assemble the site
        run: sh site/build.sh _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
