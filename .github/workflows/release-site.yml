name: Release on the website

# Publishing a release by hand (the draft that release.yml makes, when it
# stopped before publishing it) rebuilds the website, so that latest.txt says
# the new version and Xylem's update check sees it (docs/plans/update-check.md).
# When release.yml publishes the release itself, this does not run: GitHub
# starts no workflow from an event made with a workflow's token, so release.yml
# rebuilds the website itself. The website is built from main: only main may
# deploy to GitHub Pages, and a release runs on its tag.

on:
  release:
    types: [published]

permissions:
  actions: write

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
