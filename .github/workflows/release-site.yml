name: Release on the website

# Publishing a release (the draft that release.yml makes) rebuilds the website,
# so that latest.txt says the new version and Xylem's update check sees it
# (docs/plans/update-check.md). The website is built from main: only main may
# deploy to GitHub Pages, and a release runs on its tag.

on:
  release:
    types: [published]

permissions:
  actions: write

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
