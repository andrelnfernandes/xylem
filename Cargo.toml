[package]
# On crates.io "xylem" and "xy" belong to other projects; the command is `xy`.
name = "xylem-fm"
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/andrelnfernandes/xylem"
homepage = "https://andrelnfernandes.github.io/xylem/"
description = "Terminal file manager: one tree for your whole disk, tags across folders, SQLite and spreadsheets in the viewer, duplicates, SSH and cloud"
readme = "README.md"
keywords = ["file-manager", "xtree", "ztree", "tui", "terminal"]
categories = ["command-line-utilities", "filesystem"]
# What goes to crates.io: the code, the demo files (which its tests read), the
# Windows icon (build.rs), the license and the READMEs (the screenshots stay on GitHub, where the
# READMEs' images point).
include = ["/src/**/*.rs", "/build.rs", "/docs/icons/xylem.ico", "/docs/manual/**/*.md", "/demo/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/README.pt-BR.md"]

[[bin]]
name = "xy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
bzip2 = "0.6"
bytes = "1"
calamine = "0.37"
chrono = "0.4.45"
csv = "1.4"
dbase = { version = "0.8", default-features = false, features = ["yore"] }
dunce = "1.0.5"
flate2 = "1.1.10"
globset = "0.4.20"
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz", "optimization"] }
notify = { version = "8.2.0", default-features = false }
portable-pty = "0.9.0"
ratatui = "0.30.2"
regex = "1.13"
rusqlite = { version = "0.33", features = ["bundled", "hooks", "column_decltype"] }
ruzstd = "0.9"
parquet = { version = "60.1", default-features = false, features = ["arrow", "snap", "flate2-zlib-rs", "lz4_flex", "zstd"] }
arrow-array = "60.1"
arrow-cast = { version = "60.1", default-features = false }
arrow-schema = "60.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["bzip2", "ppmd", "deflate"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing"] }
tar = "0.4.46"
toml = "1.1.8"
toml_edit = "0.25.17"
trash = "5.2.9"
tui-term = "0.3.4"
vt100 = "0.16.2"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
pulldown-cmark = { version = "0.13.6", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "net", "process", "user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# The icon of xy.exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
# Encoders, only to build test archives (the program only reads xz and 7z).
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz", "encoder"] }
proptest = "1.12"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
tempfile = "3.27.0"

# Binário de release menor e um pouco mais rápido.
[profile.release]
lto = true
codegen-units = 1
strip = true

# The .deb and .rpm packages, built by packaging/linux/packages.sh
# (cargo-deb and cargo-generate-rpm) from the static musl binary, so they
# depend on no library (cargo-deb warns that it found no $auto
# dependencies, and leaves Depends out). target/release/xy.1.gz is the man
# page, which the script generates with `xy --man` before packaging.
[package.metadata.deb]
maintainer = "Andre L N Fernandes <16240275+andrelnfernandes@users.noreply.github.com>"
copyright = "Andre L N Fernandes"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """\
Xylem (the command is xy) is a text-mode file manager inspired by XTree \
and ZTreeWin: the tree and the file window, tags and group operations, \
archives, a split window, a built-in terminal, remote machines over SSH, \
cloud storage through rclone and Git."""
recommends = "openssh-client"
suggests = "git, rclone"
assets = [
    ["target/release/xy", "usr/bin/", "755"],
    ["target/release/xy.1.gz", "usr/share/man/man1/", "644"],
    ["packaging/linux/xylem.desktop", "usr/share/applications/", "644"],
    ["docs/icons/xylem.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["docs/icons/xylem-16.png", "usr/share/icons/hicolor/16x16/apps/xylem.png", "644"],
    ["docs/icons/xylem-32.png", "usr/share/icons/hicolor/32x32/apps/xylem.png", "644"],
    ["docs/icons/xylem-48.png", "usr/share/icons/hicolor/48x48/apps/xylem.png", "644"],
    ["docs/icons/xylem-64.png", "usr/share/icons/hicolor/64x64/apps/xylem.png", "644"],
    ["docs/icons/xylem-128.png", "usr/share/icons/hicolor/128x128/apps/xylem.png", "644"],
    ["docs/icons/xylem-256.png", "usr/share/icons/hicolor/256x256/apps/xylem.png", "644"],
    ["docs/icons/xylem-512.png", "usr/share/icons/hicolor/512x512/apps/xylem.png", "644"],
    ["README.md", "usr/share/doc/xylem-fm/", "644"],
    ["README.pt-BR.md", "usr/share/doc/xylem-fm/", "644"],
]

[package.metadata.generate-rpm]
auto-req = "no"
assets = [
    { source = "target/release/xy", dest = "/usr/bin/xy", mode = "755" },
    { source = "target/release/xy.1.gz", dest = "/usr/share/man/man1/xy.1.gz", mode = "644", doc = true },
    { source = "packaging/linux/xylem.desktop", dest = "/usr/share/applications/xylem.desktop", mode = "644" },
    { source = "docs/icons/xylem.svg", dest = "/usr/share/icons/hicolor/scalable/apps/xylem.svg", mode = "644" },
    { source = "docs/icons/xylem-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/xylem.png", mode = "644" },
    { source = "docs/icons/xylem-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/xylem.png", mode = "644" },
    { source = "docs/icons/xylem-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/xylem.png", mode = "644" },
    { source = "docs/icons/xylem-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/xylem.png", mode = "644" },
    { source = "docs/icons/xylem-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/xylem.png", mode = "644" },
    { source = "docs/icons/xylem-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/xylem.png", mode = "644" },
    { source = "docs/icons/xylem-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/xylem.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/xylem-fm/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/xylem-fm/README.md", mode = "644", doc = true },
    { source = "README.pt-BR.md", dest = "/usr/share/doc/xylem-fm/README.pt-BR.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.recommends]
openssh-clients = "*"

[package.metadata.generate-rpm.suggests]
git = "*"
rclone = "*"
